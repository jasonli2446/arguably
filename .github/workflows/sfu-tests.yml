name: SFU Tests

on:
  push:
  pull_request:

jobs:
  sfu-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SFU tests
        run: npx vitest run --config vitest.sfu.config.ts
